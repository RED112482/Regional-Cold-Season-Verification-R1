name: Inspect NDFD MinT archive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ndfd_probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect NDFD mint archive objects
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          dates = ["2026/11/12","2026/11/13","2026/11/14","2026/11/15"]
          base = "https://noaa-ndfd-pds.s3.amazonaws.com/"
          result = {}
          ns = {"s3":"http://s3.amazonaws.com/doc/2006-03-01/"}

          for d in dates:
              prefix = f"wmo/mint/{d}/"
              url = base + "?" + urllib.parse.urlencode({
                  "list-type":"2",
                  "prefix":prefix,
                  "max-keys":"1000",
              })
              req = urllib.request.Request(url, headers={"User-Agent":"NDFD-history-probe/1.0"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  xml = r.read()
              root = ET.fromstring(xml)
              rows = []
              for obj in root.findall("s3:Contents", ns):
                  rows.append({
                      "key": obj.findtext("s3:Key", default="", namespaces=ns),
                      "lastModified": obj.findtext("s3:LastModified", default="", namespaces=ns),
                      "size": int(obj.findtext("s3:Size", default="0", namespaces=ns) or 0),
                  })
              result[d] = {"count": len(rows), "objects": rows[:1000]}

          Path("site/data/ndfd_probe.json").write_text(json.dumps(result, indent=2))
          for d, block in result.items():
              print(d, block["count"])
              for row in block["objects"][:30]:
                  print(" ", row["key"], row["lastModified"], row["size"])
          PY

      - name: Save probe results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/ndfd_probe.json
          if git diff --cached --quiet; then
            echo "Probe unchanged."
          else
            git commit -m "Save NDFD MinT archive inspection"
            git push origin HEAD:main
          fi
