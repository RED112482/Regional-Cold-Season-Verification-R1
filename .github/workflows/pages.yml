name: Build data + deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/index.html"
      - "site/.nojekyll"
      - "site/data/forecast.json"
      - "scripts/**"
      - ".github/workflows/pages.yml"
      - "README.md"
  schedule:
    - cron: "30 10 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      season:
        description: "Season start year, current, or all"
        required: true
        default: "current"
        type: string
      mode:
        description: "Observation dataset(s)"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - all
          - asosawos

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static cold-season data
        if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Refresh NDFD forecast guidance') }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SEASON="${{ inputs.season }}"
            MODE="${{ inputs.mode }}"
          elif [ ! -f site/data/.history_complete ]; then
            # First GitHub-only bootstrap: build every Sep-May season once so
            # end users never see a "season not generated" message.
            SEASON="all"
            MODE="both"
          else
            SEASON="current"
            MODE="both"
          fi
          echo "Building season: $SEASON; mode: $MODE"
          python scripts/build_season.py --season "$SEASON" --mode "$MODE"
          if [ "$SEASON" = "all" ]; then
            touch site/data/.history_complete
          fi

      - name: Save generated datasets to the repository
        if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Refresh NDFD forecast guidance') }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the freshly generated data, then move the working tree to the
          # newest main branch before committing. This avoids conflicts when
          # two workflow runs overlap.
          rm -rf /tmp/cold-season-data
          mkdir -p /tmp/cold-season-data
          cp -a site/data/. /tmp/cold-season-data/

          git fetch origin main
          git reset --hard origin/main

          # The NDFD forecast has its own ~30 minute refresh workflow. Preserve
          # whichever forecast file is newest on main while replacing the
          # heavier seasonal-history files.
          if [ -f site/data/forecast.json ]; then
            cp site/data/forecast.json /tmp/latest-forecast.json
          fi

          rm -rf site/data
          mkdir -p site/data
          cp -a /tmp/cold-season-data/. site/data/
          if [ -f /tmp/latest-forecast.json ]; then
            cp /tmp/latest-forecast.json site/data/forecast.json
          fi
          git add site/data

          if git diff --cached --quiet; then
            echo "No generated-data changes to commit."
          else
            git commit -m "Update generated cold-season data"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-data
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
