name: Inspect URMA TMIN and NBM MinT records

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify_field_probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3 eccodes eccodeslib numpy
      - name: Probe fields
        run: |
          python - <<'PY'
          import boto3, tempfile, os
          import numpy as np
          from pathlib import Path
          from botocore import UNSIGNED
          from botocore.client import Config
          from eccodes import codes_grib_new_from_file,codes_get,codes_release
          s3=boto3.client("s3",config=Config(signature_version=UNSIGNED))

          def get_idx(bucket,key):
              return s3.get_object(Bucket=bucket,Key=key+".idx")["Body"].read().decode("utf-8","replace").splitlines()

          def range_for(lines, i, size):
              start=int(lines[i].split(":")[1])
              end=(int(lines[i+1].split(":")[1])-1) if i+1<len(lines) else size-1
              return start,end

          print("=== URMA TMIN ===")
          b="noaa-urma-pds"
          k="urma2p5.20261115/urma2p5.t20z.2dvaranl_ndfd.grb2_wexp"
          lines=get_idx(b,k)
          for i,line in enumerate(lines):
              if ":TMIN:" not in line:
                  continue
              print("IDX",line)
              size=s3.head_object(Bucket=b,Key=k)["ContentLength"]
              a,z=range_for(lines,i,size)
              body=s3.get_object(Bucket=b,Key=k,Range=f"bytes={a}-{z}")["Body"].read()
              fd,path=tempfile.mkstemp(suffix=".grb2");os.close(fd);Path(path).write_bytes(body)
              try:
                  with open(path,"rb") as fh:
                      gid=codes_grib_new_from_file(fh)
                      print("META", {name:(codes_get(gid,name) if gid is not None else None) for name in ["shortName","name","stepType","dataDate","dataTime","validityDate","validityTime","forecastTime","startStep","endStep","stepRange"]})
                      if gid is not None: codes_release(gid)
              finally:
                  os.unlink(path)

          print("\n=== Search all 12Z QMD files for MinT percentile records ===")
          b="noaa-nbm-grib2-pds"
          pref="blend.20261115/12/qmd/"
          r=s3.list_objects_v2(Bucket=b,Prefix=pref,MaxKeys=1000)
          keys=[o["Key"] for o in r.get("Contents",[]) if o["Key"].endswith(".co.grib2")]
          print("FILES",len(keys))
          found=0
          for k in keys:
              try: lines=get_idx(b,k)
              except Exception: continue
              hits=[]
              for line in lines:
                  up=line.upper()
                  if "TMIN" in up or ("TMP" in up and "MIN FCST" in up and any(p in up for p in ("10% LEVEL","25% LEVEL","50% LEVEL","75% LEVEL","90% LEVEL"))):
                      hits.append(line)
              if hits:
                  print("\nKEY",k)
                  for line in hits: print(line)
                  found += len(hits)
          print("FOUND",found)
          PY
