name: Refresh CWOP APRS station history

on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_cwop.py"
      - ".github/workflows/cwop.yml"

permissions:
  contents: write

concurrency:
  group: "cwop-observations"
  cancel-in-progress: false

jobs:
  cwop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Synoptic CWOP history cache (per-CWA publish)
        env:
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}
        run: python scripts/build_cwop.py
      - name: Validate CWOP JSON
        shell: bash
        run: |
          test -s site/data/cwop_recent.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("site/data/cwop_recent.json")
          d=json.loads(p.read_text())
          assert isinstance(d.get("stations"), list)
          assert isinstance(d.get("observations"), list)
          print("CWOP stations:", len(d["stations"]))
          print("CWOP observations:", len(d["observations"]))
          print("Status:", d.get("status"))
          assert (d.get("status") or {}).get("batchesSuccessful", 0) > 0
          PY

      - name: Save CWOP JSON
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp site/data/cwop_recent.json /tmp/cwop_recent.json
          rm -rf /tmp/cwop
          cp -R site/data/cwop /tmp/cwop
          git fetch origin main
          git reset --hard origin/main
          mkdir -p site/data
          cp /tmp/cwop_recent.json site/data/cwop_recent.json
          rm -rf site/data/cwop
          cp -R /tmp/cwop site/data/cwop
          git add site/data/cwop_recent.json site/data/cwop
          if git diff --cached --quiet; then
            echo "CWOP data unchanged."
          else
            git commit -m "Refresh CWOP APRS verification observations"
            git push origin HEAD:main
          fi
