name: Refresh NDFD forecast guidance

on:
  schedule:
    - cron: "17,47 * * * *"
      timezone: "America/Chicago"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_forecast.py"
      - ".github/workflows/forecast.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "forecast-pages"
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build NDFD guidance
        run: python scripts/build_forecast.py

      - name: Save latest forecast JSON
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp site/data/forecast.json /tmp/forecast.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/forecast.json site/data/forecast.json
          git add site/data/forecast.json

          if git diff --cached --quiet; then
            echo "Forecast data unchanged."
          else
            git commit -m "Refresh NDFD forecast guidance"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: forecast
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
