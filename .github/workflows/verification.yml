name: Refresh NBM verification trends

on:
  schedule:
    - cron: "30 14 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_verification.py"
      - ".github/workflows/verification.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "nbm-verification-data"
  cancel-in-progress: true

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with forecast history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GRIB verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy boto3 eccodes eccodeslib

      - name: Build rolling 5-day MinT verification (NDFD archive + RTMA)
        run: python scripts/build_verification.py

      - name: Validate lead-time verification schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("site/data/verification.json").read_text())
          assert p.get("schemaVersion") == 4, "verification.json is not spatial lead-time schema v4"
          coastal = {"MOB", "LIX", "TAE"}
          for wfo, block in p.get("cwas", {}).items():
              scopes = block.get("scopes") or {}
              expected = {"land", "marine", "both"} if wfo in coastal else {"land"}
              assert expected.issubset(scopes), f"{wfo}: missing scopes {sorted(expected-set(scopes))}"
              for mode in expected:
                  scope = scopes[mode]
                  by_lead = scope.get("byLead") or {}
                  for lead in ("12", "24", "36", "48", "60"):
                      assert lead in by_lead, f"{wfo}/{mode}: missing lead {lead}"
                      ndfd = (by_lead.get(lead) or {}).get("dailyMae", {}).get("NDFD")
                      det = (by_lead.get(lead) or {}).get("dailyMae", {}).get("NBM Deterministic")
                      if mode == "land":
                          assert isinstance(ndfd, list) and any(v is not None for v in ndfd), f"{wfo}/{mode}: NDFD lead {lead} has no verification data"
                      assert isinstance(det, list) and any(v is not None for v in det), f"{wfo}/{mode}: NBM Det lead {lead} has no verification data"
          print("Spatial lead-time schema v4 validated with NDFD + exact NBM TMIN.")
          PY

      - name: Save verification JSON
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp site/data/verification.json /tmp/verification.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/verification.json site/data/verification.json
          git add site/data/verification.json

          if git diff --cached --quiet; then
            echo "Verification data unchanged."
          else
            git commit -m "Refresh NBM verification trends"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload refreshed site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verification
    steps:
      - name: Deploy refreshed verification to Pages
        id: deployment
        uses: actions/deploy-pages@v4
