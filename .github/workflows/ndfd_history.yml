name: Backfill NDFD lead history

on:
  push:
    branches: [main]
    paths:
      - "scripts/backfill_ndfd_history.py"
      - ".github/workflows/ndfd_history.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "ndfd-history-backfill"
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with forecast history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy boto3 eccodes eccodeslib

      - name: Backfill NDFD history only
        run: python scripts/backfill_ndfd_history.py

      - name: Validate all NDFD leads
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("site/data/verification.json").read_text())
          assert p.get("schemaVersion")==3
          for wfo,block in p.get("cwas",{}).items():
              for lead in ("12","24","36","48","60"):
                  vals=((((block.get("byLead") or {}).get(lead) or {}).get("dailyMae") or {}).get("NDFD") or [])
                  assert any(v is not None for v in vals), f"{wfo} F{lead}: no NDFD history"
          print("All CWAs have NDFD at 12/24/36/48/60h.")
          PY

      - name: Save updated verification JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/verification.json
          if git diff --cached --quiet; then
            echo "No NDFD history changes."
          else
            git commit -m "Backfill NDFD lead-time verification history"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload refreshed site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy refreshed site
        uses: actions/deploy-pages@v4
