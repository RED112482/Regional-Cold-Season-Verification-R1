<body>
<h1>Just a second...</h1>
<p id="s">Verifying your browser...</p>
<div id="bar"><div id="fill"></div></div>

<form id="f" method="POST" action="">
<input type="hidden" name="pow_challenge" id="c" value="c474f1cdd0358b50794ab84b5ea239e6">
<input type="hidden" name="pow_nonce" id="n" value="">
<input type="hidden" name="pow_sig" value="137c98b5412900f7fc9f58e5df3786c02ebca45054f03f5b07743bc65d9537d8">
<input type="hidden" name="pow_expiry" value="1794740929">
</form>

<script>
(function() {
    var challenge = document.getElementById('c').value;
    var difficulty = 18;
    var form = document.getElementById('f');
    var fill = document.getElementById('fill');
    var encoder = new TextEncoder();
    var nonce = 0;
    var expected = 1 << difficulty;

    function checkHash(hash) {
        var remaining = difficulty;
        for (var i = 0; remaining > 0; i++) {
            if (remaining >= 8) {
                if (hash[i] !== 0) return false;
                remaining -= 8;
            } else {
                if ((hash[i] >> (8 - remaining)) !== 0) return false;
                remaining = 0;
            }
        }
        return true;
    }

    function solveBatch() {
        var batch = 1000;
        var promises = new Array(batch);
        var nonces = new Array(batch);
        for (var i = 0; i < batch; i++) {
            nonces[i] = (nonce + i).toString(16);
            promises[i] = crypto.subtle.digest('SHA-256', encoder.encode(challenge + nonces[i]));
        }
        Promise.all(promises).then(function(results) {
            for (var i = 0; i < results.length; i++) {
                if (checkHash(new Uint8Array(results[i]))) {
                    document.getElementById('n').value = nonces[i];
                    fill.style.width = '100%';
                    form.submit();
                    return;
                }
            }
            nonce += batch;
            var pct = Math.min(95, Math.round(nonce / expected * 100));
            fill.style.width = pct + '%';
            setTimeout(solveBatch, 0);
        });
    }

    solveBatch();
})();
</script>
